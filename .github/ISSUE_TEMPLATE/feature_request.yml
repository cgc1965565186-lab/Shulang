name: Feature request / 功能建议
description: Suggest an improvement / 提出改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve? / 你遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 你希望怎样解决？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context / 其他方案或补充信息
